{% extends 'base.html' %}

{% block title %}Greeting Page{% endblock %}

{% block content %}

    <!-- Navigation Bar -->
    <nav class="navbar navbar-light bg-light flex-column align-items-start p-3">
    <a class="navbar-brand" href="#">FlaskApp</a>
    <ul class="navbar-nav flex-column w-100">
        <li class="nav-item active">
            <a class="nav-link" href="{{ url_for('users.greetings', name='John') }}">Greet John</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="{{ url_for('users.admin') }}">Admin</a>
        </li>
    </ul>
    </nav>

    <!-- Main content -->
    <div class="container mt-5">
        <h1 class="display-4">Hello :)</h1>
        <h2 class="mt-4">User: {{ name }}</h2>

        {% if age %}
            <h3 class="text-success">Age: {{ age }}</h3>
        {% else %}
            <h3 class="text-danger">Age: Not provided</h3>
        {% endif %}
    </div>

{% endblock %}
