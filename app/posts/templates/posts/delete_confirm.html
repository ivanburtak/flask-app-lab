{% extends "base.html" %}
{% block title %}Delete Post{% endblock %}

{% block content %}
<div class="card p-4">
    <h3>Are you sure you want to delete this post?</h3>
    <h5>{{ post.title }}</h5>
    <form method="POST">
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{{ url_for('posts.detail_post', post_id=post.id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
