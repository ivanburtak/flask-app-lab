{% extends 'base.html' %}

{% block title %} PRODUCT DETAILS {% endblock %}

{% block content %}
<h1>Product № {{ product["id"] }} — {{ product["name"] }}</h1>

<p>{{ product["description"] }}</p>
<p><strong>Price:</strong> ${{ product["price"] }}</p>

<a href="{{ url_for('products.get_products') }}">Return to product list</a>
{% endblock %}
