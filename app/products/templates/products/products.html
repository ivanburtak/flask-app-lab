{% extends 'base.html' %}

{% block title %} PRODUCTS {% endblock %}

{% block content %}

<h1>Product List</h1>

<ul>
    {% for product in products %}
        <li>
            {{ product["id"] }} -
            <a href="{{ url_for('products.detail_product', id=product['id']) }}">
                {{ product["name"] }}
            </a>
        </li>
    {% endfor %}
</ul>

{% endblock %}
